name: Backend CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "backend/**"
  push:
    branches: [dev, main]
    paths:
      - "backend/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew test

  # local 로로필도 한 더 검증 - what is diff with test profile? -> flyway mygration - scheme , redis , etc
  local-profile-boot-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: handdam
          POSTGRES_PASSWORD: handdam1234_local_only
          POSTGRES_DB: handdam
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Boot with local profile against real Postgres/Redis
        env:
          SPRING_PROFILES_ACTIVE: local
          GOOGLE_CLIENT_ID: ci-dummy-client-id
          GOOGLE_CLIENT_SECRET: ci-dummy-client-secret
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          ./gradlew bootRun > boot.log 2>&1 &
          APP_PID=$!

          for i in $(seq 1 30); do
            if grep -q "Started HanDdamApplication" boot.log; then
              echo "Boot succeeded (Flyway migration + schema validation passed)"
              kill $APP_PID
              exit 0
            fi
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "App process exited early"
              cat boot.log
              exit 1
            fi
            sleep 2
          done

          echo "App did not start within timeout"
          cat boot.log
          kill $APP_PID 2>/dev/null || true
          exit 1
