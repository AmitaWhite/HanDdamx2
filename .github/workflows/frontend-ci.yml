name: Frontend CI

# PR 단계에서 프론트가 깨지지 않는지 조기에 검증한다(타입체크 + 빌드).
# 배포와는 분리 — 여기서는 이미지 빌드/푸시를 하지 않는다.
on:
  pull_request:
    branches: [dev, main]
    paths:
      - "frontend/**"
  push:
    branches: [dev, main]
    paths:
      - "frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check and build
        # package.json 의 build 스크립트가 `tsc --noEmit && vite build` 를 수행
        run: bun run build
