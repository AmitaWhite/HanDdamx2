# 프론트 정적 파일 서빙 전용 nginx 설정.
# API/WS 라우팅은 이 컨테이너가 아니라 엣지의 리버스 프록시(Caddy)가 담당한다.
# 여기서는 SPA(single page app) fallback만 처리한다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 정적 에셋은 오래 캐시.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 라우팅: 존재하지 않는 경로는 index.html로 되돌려 React Router가 처리하게 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
