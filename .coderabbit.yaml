language: "ko-KR"

reviews:
  profile: chill
  poem: false
  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/gradle-wrapper.jar"
  tools:
    gitleaks:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "dev"
chat:
  auto_reply: true
